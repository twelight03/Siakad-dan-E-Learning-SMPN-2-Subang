# ==============================================================================
# KONFIGURASI KEAMANAN & ANTI-DDOS NGINX - SIAKAD SMPN 2 SUBANG
# File: /etc/nginx/conf.d/siakad-anti-ddos.conf (atau sertakan di nginx.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RESTORASI REAL VISITOR IP DARI CLOUDFLARE (CF-Connecting-IP)
# Memastikan limit_req menghitung IP asli pengunjung, bukan IP proxy Cloudflare
# ------------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ------------------------------------------------------------------------------
# 2. DEFINISI MEMORI RATE LIMITING & CONNECTION LIMITING (LEAKY BUCKET)
# ------------------------------------------------------------------------------
# Membatasi frekuensi request: 15 request per detik per IP asli (zone 10MB cukup untuk 160.000 IP)
limit_req_zone $binary_remote_addr zone=siakad_req_limit:10m rate=15r/s;

# Membatasi jumlah koneksi aktif serentak: Maksimal 15 koneksi paralel per IP
limit_conn_zone $binary_remote_addr zone=siakad_conn_limit:10m;

# Mengembalikan HTTP 429 (Too Many Requests) jika terkena rate limit (bukan 503)
limit_req_status 429;
limit_conn_status 429;

# ------------------------------------------------------------------------------
# 3. MITIGASI SERANGAN SLOWLORIS & TIMEOUT KONEKSI
# Menutup koneksi yang sengaja menggantung atau mengirim paket perlahan
# ------------------------------------------------------------------------------
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
send_timeout 10s;

# ------------------------------------------------------------------------------
# 4. PEMBATASAN BUFFER & UKURAN PAYLOAD REQUEST (ANTI-MEMORY EXHAUSTION)
# ------------------------------------------------------------------------------
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_max_body_size 15M; # Batas maksimal upload file materi/tugas siswa 15 MB
