# ==============================================================================
# VIRTUAL HOST NGINX DENGAN PROTEKSI ANTI-DDOS - SIAKAD SMPN 2 SUBANG
# Lokasi: /etc/nginx/sites-available/siakad
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fraction-capability-attempting-alarm.trycloudflare.com siakad.smpn2subang.sch.id localhost;
    root /var/www/siakad/public;

    index index.php index.html;

    # 1. Terapkan Rate Limiting & Connection Limiting ke seluruh route aplikasi
    limit_req zone=siakad_req_limit burst=25 nodelay;
    limit_conn siakad_conn_limit 15;

    # 2. Blokir Akses Terhadap File Tersembunyi (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 3. Penanganan Routing Aplikasi Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Caching Aset Statis untuk Mengurangi Beban I/O Disk & CPU
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 5. Eksekusi PHP-FPM 8.2 FastCGI
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout PHP FastCGI (Mencegah PHP Worker macet saat diserang)
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # 6. Logging Akses
    access_log /var/log/nginx/siakad_access.log combined;
    error_log /var/log/nginx/siakad_error.log warn;
}
